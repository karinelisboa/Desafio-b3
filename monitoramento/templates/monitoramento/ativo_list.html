<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ativos Monitorados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container bg-white p-5 rounded shadow" style="max-width: 800px; width: 100%;">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary m-0">📊 Ativos Monitorados</h2>
        <a href="{% url 'criar_ativo' %}" class="btn btn-primary shadow-sm">+ Novo Ativo</a>
      </div>

      {% if object_list %}
        <div class="row row-cols-1 row-cols-md-2 g-4">
          {% for ativo in object_list %}
            <div class="col">
              <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                  <h5 class="card-title text-primary mb-2">
                    <i class="bi bi-bar-chart-fill me-2"></i>{{ ativo.codigo }}
                  </h5>
                  <p class="card-text text-muted mb-0">{{ ativo.nome }}</p>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex justify-content-end gap-2">
                  <a href="{% url 'editar_ativo' ativo.pk %}" class="btn btn-sm btn-outline-warning">
                    ✏️ Editar
                  </a>
                  <a href="{% url 'visualizar_cotacoes' ativo.pk %}" class="btn btn-sm btn-outline-info">
                    📈 Ver Cotações
                  </a>
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      {% else %}
        <div class="alert alert-secondary text-center mt-4" role="alert">
          Nenhum ativo cadastrado ainda. Que tal começar clicando em <strong>“Novo Ativo”</strong>?
        </div>
      {% endif %}

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
