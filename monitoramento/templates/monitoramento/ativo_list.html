<h2>Ativos Monitorados</h2>
<a href="{% url 'criar_ativo' %}">Novo Ativo</a>
<ul>
  {% for ativo in object_list %}

      {{ ativo.codigo }} - {{ ativo.nome }}

      <a href="{% url 'visualizar_cotacoes' ativo.pk %}">Ver Cotações</a>
    </li>
  {% endfor %}
</ul>
