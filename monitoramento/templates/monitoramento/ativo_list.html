<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">📊 Ativos Monitorados</h2>
    <a href="{% url 'criar_ativo' %}" class="btn btn-outline-primary shadow-sm">+ Novo Ativo</a>
  </div>

  {% if object_list %}
    <div class="row row-cols-1 row-cols-md-2 g-4">
      {% for ativo in object_list %}
        <div class="col">
          <div class="card shadow-sm h-100 border-0">
            <div class="card-body">
              <h5 class="card-title text-dark">
                <i class="bi bi-bar-chart-fill me-2 text-primary"></i>
                {{ ativo.codigo }} - <span class="text-muted">{{ ativo.nome }}</span>
              </h5>
            </div>
            <div class="card-footer bg-white border-top-0 d-flex justify-content-end gap-2">
              <a href="{% url 'editar_ativo' ativo.pk %}" class="btn btn-sm btn-outline-warning">
                ✏️ Editar
              </a>
              <a href="{% url 'visualizar_cotacoes' ativo.pk %}" class="btn btn-sm btn-outline-info">
                📈 Ver Cotações
              </a>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-secondary text-center mt-4" role="alert">
      Nenhum ativo cadastrado ainda. Que tal começar clicando em <strong>“Novo Ativo”</strong>?
    </div>
  {% endif %}
</div>
